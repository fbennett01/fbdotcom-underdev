<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn Bennett | Updating</title>
    <style>
        :root {
            --bg-tint: rgba(15, 23, 42, 0.55);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #22d3ee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, #172554 0%, transparent 45%),
                radial-gradient(circle at 80% 10%, #0f766e 0%, transparent 40%),
                linear-gradient(160deg, #020617 0%, #0b1120 45%, #111827 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #viewport-container {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 1;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.65) brightness(0.75) contrast(1.05);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.35), rgba(2, 6, 23, 0.7));
            backdrop-filter: contrast(1.05) saturate(1.1);
            -webkit-backdrop-filter: contrast(1.05) saturate(1.1);
            z-index: 2;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4rem;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 18px;
            border-radius: 100px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite ease-in-out;
        }

        .main-message {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            margin-top: clamp(2rem, 8vh, 6rem);
        }

        #cycling-text {
            font-size: clamp(1.2rem, 2.8vw, 2rem);
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--text-main);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }

        footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
            }
            header {
                flex-direction: column;
                gap: 1.5rem;
            }
            #cycling-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="viewport-container">
        <video id="bg-video" autoplay muted loop playsinline></video>
    </div>

    <div class="overlay"></div>

    <div class="ui-layer">
        <header>
            <h1>Finn Bennett</h1>
            <div class="status-pill">
                <div class="dot"></div>
                Updating
            </div>
        </header>

        <div class="main-message">
            <div id="cycling-text">under development...be back soon!</div>
        </div>

        <footer>
            <span>© 2026</span>
            <span>Ventura, California</span>
        </footer>
    </div>

    <script>
        const viewport = document.getElementById('viewport-container');
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth - 0.5) * 2;
            targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma) {
                targetX = (e.gamma / 45);
                targetY = (e.beta / 45);
            }
        });

        function animate() {
            currentX += (targetX - currentX) * 0.05;
            currentY += (targetY - currentY) * 0.05;

            const rotationZ = currentX * 4;
            const rotationX = currentY * -2;
            const translateX = currentX * -30;
            const translateY = currentY * -30;

            viewport.style.transform = `
                rotateZ(${rotationZ}deg)
                rotateX(${rotationX}deg)
                translateX(${translateX}px)
                translateY(${translateY}px)
                scale(1.05)
            `;
            requestAnimationFrame(animate);
        }

        document.body.addEventListener('touchstart', () => {
            const video = document.getElementById('bg-video');
            if (video.paused) video.play();
        }, { once: true });

        animate();
    </script>
</body>
</html>
